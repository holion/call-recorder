<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anna</title>
    <script type="module" src="/src/anna.ts"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* ── Floating card ── */

      #card {
        position: fixed;
        inset: 10px;
        background: #19192b;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        box-shadow:
          0 2px 8px rgba(0, 0, 0, 0.6),
          0 8px 32px rgba(0, 0, 0, 0.4);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        /* Starts off-screen right; JS adds .visible to slide in */
        transform: translateX(calc(100% + 30px));
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #card.visible {
        transform: translateX(0);
      }

      /* ── Header ── */

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 13px 14px 11px;
        flex-shrink: 0;
        -webkit-app-region: drag;
      }

      .card-title {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #ffffff;
      }

      .card-actions {
        display: flex;
        align-items: center;
        gap: 2px;
        -webkit-app-region: no-drag;
      }

      .icon-btn {
        background: none;
        border: none;
        color: rgba(255, 255, 255, 0.4);
        cursor: pointer;
        padding: 5px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s, color 0.15s;
        -webkit-app-region: no-drag;
      }

      .icon-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.9);
      }

      /* ── Divider ── */

      .card-divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.07);
        flex-shrink: 0;
      }

      /* ── Body ── */

      .card-body {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
      }

      .card-body::-webkit-scrollbar { width: 4px; }
      .card-body::-webkit-scrollbar-track { background: transparent; }
      .card-body::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 2px;
      }

      /* ── Thinking indicator ── */

      #thinking {
        display: flex;
        align-items: center;
        gap: 10px;
        color: rgba(255, 255, 255, 0.4);
        font-size: 14px;
      }

      #thinking.hidden { display: none; }

      .dots { display: flex; gap: 5px; align-items: center; }
      .dots span {
        display: block;
        width: 7px;
        height: 7px;
        background: #4a90d9;
        border-radius: 50%;
        animation: bounce 1.2s ease-in-out infinite;
      }
      .dots span:nth-child(2) { animation-delay: 0.2s; }
      .dots span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
        40% { transform: translateY(-5px); opacity: 1; }
      }

      /* ── Response text ── */

      #response-text {
        font-size: 15px;
        line-height: 1.7;
        color: #eeeef0;
        white-space: pre-wrap;
        word-break: break-word;
        user-select: text;
        -webkit-user-select: text;
        display: none;
      }

      #response-text.visible { display: block; }
      #response-text.error { color: #e74c3c; }

      .insert-wrap {
        margin-top: 14px;
        display: none;
      }

      .insert-wrap.visible {
        display: block;
      }

      .insert-btn {
        width: 100%;
        border: none;
        border-radius: 8px;
        background: #4a90d9;
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        padding: 10px 12px;
        cursor: pointer;
      }

      .insert-btn:hover {
        background: #5ba0e8;
      }

      .insert-hint {
        margin-top: 8px;
        text-align: center;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="card">
      <div class="card-header">
        <span class="card-title">Anna</span>
        <div class="card-actions">
          <button class="icon-btn" id="copy-btn" title="Kopiér svar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </button>
          <button class="icon-btn" id="close-btn" title="Luk (ESC)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"/>
              <line x1="6" y1="6" x2="18" y2="18"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="card-divider"></div>

      <div class="card-body">
        <div id="thinking">
          <div class="dots">
            <span></span><span></span><span></span>
          </div>
          <span>Tænker…</span>
        </div>
        <div id="response-text"></div>
        <div id="insert-wrap" class="insert-wrap">
          <button id="insert-btn" class="insert-btn" title="Indsæt tekst (Enter)">Indsæt tekst</button>
          <div class="insert-hint">Tryk Enter for at indsætte og lukke</div>
        </div>
      </div>
    </div>
  </body>
</html>

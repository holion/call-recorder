[package]
name = "call-recorder"
version = "0.1.0"
description = "Opkaldsoptager til salgsteam"
authors = ["Holion"]
edition = "2021"

[lib]
name = "call_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dotenvy = "0.15"

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hound = "3.5"
cpal = "0.17"
whisper-rs = "0.16"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
reqwest = { version = "0.12", features = ["stream", "json", "blocking", "multipart"] }
base64 = "0.22"
open = "5"
futures-util = "0.3"
anyhow = "1"
rubato = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "1.5"

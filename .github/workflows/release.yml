name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: macos-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Mark release start
        id: release_start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Validate tag matches app version
        run: |
          start_ts=$(date +%s)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('./src-tauri/tauri.conf.json', 'utf8')).version")
          [ "$TAG_VERSION" = "$PACKAGE_VERSION" ] || { echo "::error title=Version mismatch::Tag version $TAG_VERSION does not match package.json version $PACKAGE_VERSION"; exit 1; }
          [ "$TAG_VERSION" = "$TAURI_VERSION" ] || { echo "::error title=Version mismatch::Tag version $TAG_VERSION does not match tauri.conf.json version $TAURI_VERSION"; exit 1; }
          echo "Validate tag matches app version: $(( $(date +%s) - start_ts ))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install frontend deps
        run: |
          start_ts=$(date +%s)
          npm ci
          echo "Install frontend deps: $(( $(date +%s) - start_ts ))s" >> "$GITHUB_STEP_SUMMARY"
        shell: bash

      - name: Validate release environment
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          start_ts=$(date +%s)
          missing=0
          for name in \
            VITE_FIREBASE_API_KEY \
            VITE_FIREBASE_AUTH_DOMAIN \
            VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_STORAGE_BUCKET \
            VITE_FIREBASE_MESSAGING_SENDER_ID \
            VITE_FIREBASE_APP_ID \
            GOOGLE_CLIENT_ID \
            GOOGLE_CLIENT_SECRET
          do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing release environment::$name is not set"
              missing=1
            fi
          done
          echo "Validate release environment: $(( $(date +%s) - start_ts ))s" >> "$GITHUB_STEP_SUMMARY"
          exit "$missing"
        shell: bash

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          start_ts=$(date +%s)
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASS=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASS" $KEYCHAIN_PATH
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security find-identity -v -p codesigning $KEYCHAIN_PATH
          echo "Import Apple certificate: $(( $(date +%s) - start_ts ))s" >> "$GITHUB_STEP_SUMMARY"

      - name: Mark tauri build start
        id: tauri_start
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build and release
        id: tauri_release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Anna ${{ github.ref_name }}'
          releaseBody: 'Se commits for detaljer.'
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Summarize release timings
        if: always()
        run: |
          release_start=${{ steps.release_start.outputs.ts }}
          tauri_start=${{ steps.tauri_start.outputs.ts }}
          now=$(date +%s)
          echo "## Release timings" >> "$GITHUB_STEP_SUMMARY"
          echo "- Pre-build setup (checkout, validation, toolchain, cache, npm, cert): $(( tauri_start - release_start ))s" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tauri build and release: $(( now - tauri_start ))s" >> "$GITHUB_STEP_SUMMARY"
          echo "- Total workflow runtime so far: $(( now - release_start ))s" >> "$GITHUB_STEP_SUMMARY"
